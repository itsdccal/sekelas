<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Sekelas Logo: Two overlapping screens/frames representing virtual classroom -->
  <!-- Back frame (top-left) -->
  <rect x="4" y="6" width="28" height="18" rx="2" fill="currentColor" opacity="0.85"/>
  <!-- Front frame (bottom-right) -->
  <rect x="16" y="18" width="28" height="18" rx="2" stroke="currentColor" stroke-width="3" fill="none"/>
  <!-- Small accent square (bottom-left connector) -->
  <rect x="4" y="24" width="12" height="12" rx="1.5" fill="currentColor" opacity="0.4"/>
</svg>
